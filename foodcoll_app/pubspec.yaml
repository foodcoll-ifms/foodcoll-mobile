name: foodcoll_app
description: "FoodColl Mobile — Glossário bilíngue de collocations técnicas em Ciência e Tecnologia de Alimentos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/audio/
    - assets/images/
    - assets/images/termos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-foodcoll.png"